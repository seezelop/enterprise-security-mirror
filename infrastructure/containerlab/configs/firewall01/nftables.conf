flush ruleset

table inet filter {

    chain forward {
        type filter hook forward priority 0;
        policy drop;

	# Invalid traffic.
        ct state invalid counter drop
       
        # Stateful return traffic.
        ct state established,related counter accept

        # INTERNAL -> INTERNET TCP/443.
        iifname "eth2" oifname "eth1" tcp dport 443 counter accept

        # INTERNET -> DMZ TCP/443 after DNAT.
        iifname "eth1" oifname "eth3" ip daddr 10.70.50.10 tcp dport 443 counter accept

        # Everything else reaching the end of the chain is denied.
        counter log prefix "LAB12-FWD-DROP " drop       

    }
}

table ip nat {

    chain prerouting {
        type nat hook prerouting priority dstnat;
        policy accept;

        # Publish web01 using firewall01 public address.
        iifname "eth1" ip daddr 203.0.113.2 tcp dport 443 \
            dnat to 10.70.50.10:443
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;
        policy accept;

        # Centralized Internet breakout for HQ and branches.
        oifname "eth1" ip saddr {
            10.70.0.0/16,
            10.71.0.0/16,
            10.72.0.0/16,
            10.73.0.0/16
        } snat to 203.0.113.2
    }
}
