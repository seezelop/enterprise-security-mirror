{
  "tests": [
    {
      "name": "OSPF HQ HAS 3 FULL NEIGHBORS",
      "type": "ospf_neighbors",
      "container": "clab-lab12-core-r01",
      "expected_full": 3
    },
    {
      "name": "HQ USER -> DNS TCP/53",
      "type": "tcp",
      "source": "clab-lab12-user01",
      "destination": "10.70.20.10",
      "port": 53,
      "expected": "allow",
      "banner": "LAB12 DNS TCP53 SERVICE"
    },
    {
      "name": "HQ USER -> APP TCP/443",
      "type": "tcp",
      "source": "clab-lab12-user01",
      "destination": "10.70.20.20",
      "port": 443,
      "expected": "allow",
      "banner": "LAB12 APP TCP443 SERVICE"
    },
    {
      "name": "HQ USER -> APP TCP/22",
      "type": "tcp",
      "source": "clab-lab12-user01",
      "destination": "10.70.20.20",
      "port": 22,
      "expected": "deny"
    },
    {
      "name": "HQ USER -> MANAGEMENT TCP/22",
      "type": "tcp",
      "source": "clab-lab12-user01",
      "destination": "10.70.99.10",
      "port": 22,
      "expected": "deny"
    },
    {
      "name": "HQ ADMIN -> MANAGEMENT TCP/22",
      "type": "tcp",
      "source": "clab-lab12-admin01",
      "destination": "10.70.99.10",
      "port": 22,
      "expected": "allow",
      "banner": "LAB12 MGMT TCP22 SERVICE"
    },
    {
      "name": "BR1 USER -> HQ DNS TCP/53",
      "type": "tcp",
      "source": "clab-lab12-br1-user01",
      "destination": "10.70.20.10",
      "port": 53,
      "expected": "allow",
      "banner": "LAB12 DNS TCP53 SERVICE"
    },
    {
      "name": "BR3 USER -> HQ APP TCP/443",
      "type": "tcp",
      "source": "clab-lab12-br3-user01",
      "destination": "10.70.20.20",
      "port": 443,
      "expected": "deny"
    },
    {
      "name": "HQ USER -> INTERNET TCP/443",
      "type": "tcp",
      "source": "clab-lab12-user01",
      "destination": "198.51.100.10",
      "port": 443,
      "expected": "allow",
      "banner": "LAB12 INTERNET SERVICE"
    },
    {
      "name": "BR1 USER -> INTERNET TCP/443",
      "type": "tcp",
      "source": "clab-lab12-br1-user01",
      "destination": "198.51.100.10",
      "port": 443,
      "expected": "allow",
      "banner": "LAB12 INTERNET SERVICE"
    },
    {
      "name": "INTERNET -> DMZ TCP/443 VIA DNAT",
      "type": "tcp",
      "source": "clab-lab12-internet01",
      "destination": "203.0.113.2",
      "port": 443,
      "expected": "allow",
      "banner": "LAB12 DMZ WEB SERVICE"
    },
    {
      "name": "DMZ -> INTERNAL DNS TCP/53",
      "type": "tcp",
      "source": "clab-lab12-web01",
      "destination": "10.70.20.10",
      "port": 53,
      "expected": "deny"
    }
  ]
}
